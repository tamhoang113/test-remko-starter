# ============================================================
# [QA] Remko SDK — E2E Deploy to Vercel
# ============================================================
# ONE-TIME SETUP (manual, before first run):
#
#   1. Create FOUR Vercel projects connected to this repo (tamhoang113/test-remko-starter),
#      all watching branch: main, each with its Root Directory set:
#        remko-starter-prod     -> Root Directory: starter-prod
#        remko-starter-testing  -> Root Directory: starter-testing
#        remko-existing-prod    -> Root Directory: existing-prod
#        remko-existing-testing -> Root Directory: existing-testing
#      In each project, add the env vars for that site (CMS URL, keys, etc.)
#      so they are available during Vercel's own build.
#
#   2. For existing-* projects: commit the client site code to the matching
#      folder (existing-prod/ or existing-testing/) before the first workflow run.
#
#   3. Add these GitHub Secrets (Settings -> Secrets -> Actions):
#
#      Shared:
#        GH_PAT                             Personal Access Token, repo write scope
#        VERCEL_TOKEN                       Vercel API token
#        VERCEL_ORG_ID                      Vercel team/personal org ID
#
#      Production site:
#        PROD_CMS_URL                       e.g. https://app-xxx.cms.optimizely.com/
#        PROD_CLIENT_ID
#        PROD_CLIENT_SECRET
#        PROD_GRAPH_SECRET
#        PROD_GRAPH_APP_KEY
#        PROD_GRAPH_SINGLE_KEY
#        VERCEL_PROJECT_ID_STARTER_PROD     Project ID of remko-starter-prod
#        VERCEL_PROJECT_ID_EXISTING_PROD    Project ID of remko-existing-prod
#
#      Testing site:
#        TEST_CMS_URL                       e.g. https://app-xxx.cmstest.optimizely.com/
#        TEST_CLIENT_ID
#        TEST_CLIENT_SECRET
#        TEST_GRAPH_SECRET
#        TEST_GRAPH_APP_KEY
#        TEST_GRAPH_SINGLE_KEY
#        TEST_CMS_API_URL                   e.g. https://api.cmstest.optimizely.com/v1
#        VERCEL_PROJECT_ID_STARTER_TESTING  Project ID of remko-starter-testing
#        VERCEL_PROJECT_ID_EXISTING_TESTING Project ID of remko-existing-testing
# ============================================================

name: "[QA] Remko SDK — E2E Deploy to Vercel"

on:
  workflow_dispatch:
    inputs:
      case:
        description: "Test case"
        required: true
        type: choice
        options:
          - starter-prod
          - starter-testing
          - existing-prod
          - existing-testing
      sdk_branch:
        description: "dxp-clients branch (empty = npm default, e.g. bugfix/CMS-50805-token-endpoint-v5)"
        required: false
        default: ""
      sdk_version:
        description: "@remkoj/* npm version (existing-* only, empty = keep current, e.g. 5.4.1)"
        required: false
        default: ""

jobs:
  deploy:
    name: "Deploy [${{ inputs.case }}]"
    runs-on: ubuntu-latest

    steps:
      # -- Checkout -------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      # -- Node + corepack ------------------------------------------------------
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack
        run: corepack enable

      # -- Resolve case metadata ------------------------------------------------
      - name: Resolve case metadata
        id: config
        run: |
          CASE="${{ inputs.case }}"
          [[ "$CASE" == *-prod ]]    && SITE="prod"    || SITE="testing"
          [[ "$CASE" == starter-* ]] && MODE="starter" || MODE="existing"
          echo "site=$SITE"   >> "$GITHUB_OUTPUT"
          echo "mode=$MODE"   >> "$GITHUB_OUTPUT"
          echo "folder=$CASE" >> "$GITHUB_OUTPUT"

      # -- Bootstrap saas-starter (starter mode, first run only) ----------------
      # When the folder has no package.json, scaffold from the official template.
      # All subsequent runs skip this step.
      - name: Bootstrap saas-starter (first run only)
        if: steps.config.outputs.mode == 'starter'
        run: |
          FOLDER="${{ steps.config.outputs.folder }}"
          if [ ! -f "$FOLDER/package.json" ]; then
            echo "Bootstrapping from template into $FOLDER/..."
            corepack yarn create next-app \
              -e https://github.com/remkoj/optimizely-saas-starter/tree/main \
              /tmp/saas-starter
            mkdir -p "$FOLDER"
            shopt -s dotglob
            cp -r /tmp/saas-starter/. "$FOLDER/"
            rm -rf /tmp/saas-starter
            echo "Bootstrap done."
          else
            echo "package.json found -- skipping bootstrap."
          fi

      # -- Verify existing project ----------------------------------------------
      # For existing-* cases, the site code must be pre-committed to the folder.
      - name: Verify existing project
        if: steps.config.outputs.mode == 'existing'
        run: |
          FOLDER="${{ steps.config.outputs.folder }}"
          if [ ! -f "$FOLDER/package.json" ]; then
            echo "ERROR: $FOLDER/package.json not found."
            echo "For 'existing-*' cases, commit the client site code to $FOLDER/ before running."
            exit 1
          fi
          echo "Found existing project in $FOLDER/"

      # -- Update SDK npm version (existing mode + sdk_version input) -----------
      - name: Update SDK version in package.json
        if: steps.config.outputs.mode == 'existing' && inputs.sdk_version != ''
        run: |
          FOLDER="${{ steps.config.outputs.folder }}"
          cd "$FOLDER"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const ver = '${{ inputs.sdk_version }}';
            for (const section of ['dependencies', 'devDependencies']) {
              if (!pkg[section]) continue;
              for (const [name, val] of Object.entries(pkg[section])) {
                if (name.startsWith('@remkoj/') && !val.startsWith('portal:') && !val.startsWith('file:')) {
                  pkg[section][name] = '^' + ver;
                }
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Updated @remkoj/* to ^' + ver);
          "

      # -- Write .env from secrets ----------------------------------------------
      # .env is gitignored -- written fresh each run from GitHub Secrets.
      - name: Write .env
        run: |
          FOLDER="${{ steps.config.outputs.folder }}"
          SITE="${{ steps.config.outputs.site }}"
          if [ "$SITE" = "prod" ]; then
            cat > "$FOLDER/.env" <<'ENVEOF'
          OPTIMIZELY_CMS_URL=${{ secrets.PROD_CMS_URL }}
          OPTIMIZELY_CMS_CLIENT_ID=${{ secrets.PROD_CLIENT_ID }}
          OPTIMIZELY_CMS_CLIENT_SECRET=${{ secrets.PROD_CLIENT_SECRET }}
          OPTIMIZELY_GRAPH_SECRET=${{ secrets.PROD_GRAPH_SECRET }}
          OPTIMIZELY_GRAPH_APP_KEY=${{ secrets.PROD_GRAPH_APP_KEY }}
          OPTIMIZELY_GRAPH_SINGLE_KEY=${{ secrets.PROD_GRAPH_SINGLE_KEY }}
          ENVEOF
          else
            cat > "$FOLDER/.env" <<'ENVEOF'
          OPTIMIZELY_CMS_URL=${{ secrets.TEST_CMS_URL }}
          OPTIMIZELY_CMS_CLIENT_ID=${{ secrets.TEST_CLIENT_ID }}
          OPTIMIZELY_CMS_CLIENT_SECRET=${{ secrets.TEST_CLIENT_SECRET }}
          OPTIMIZELY_GRAPH_SECRET=${{ secrets.TEST_GRAPH_SECRET }}
          OPTIMIZELY_GRAPH_APP_KEY=${{ secrets.TEST_GRAPH_APP_KEY }}
          OPTIMIZELY_GRAPH_SINGLE_KEY=${{ secrets.TEST_GRAPH_SINGLE_KEY }}
          OPTIMIZELY_CMS_API_URL=${{ secrets.TEST_CMS_API_URL }}
          ENVEOF
          fi
          echo ".env written for site=$SITE"

      # -- Setup SDK from dxp-clients branch (optional) -------------------------
      # When sdk_branch is provided: clones, builds, packs to .packages/*.tgz,
      # and rewrites package.json to use file: paths (Vercel-compatible).
      - name: Setup SDK from dxp-clients branch
        if: inputs.sdk_branch != ''
        run: |
          chmod +x scripts/ci-setup-sdk.sh
          bash scripts/ci-setup-sdk.sh \
            "${{ inputs.sdk_branch }}" \
            "${{ steps.config.outputs.folder }}"

      # -- Install --------------------------------------------------------------
      - name: Install dependencies
        run: |
          cd "${{ steps.config.outputs.folder }}"
          corepack yarn install

      # -- Generate content types -----------------------------------------------
      - name: Generate content types (nextjs:create)
        run: |
          cd "${{ steps.config.outputs.folder }}"
          corepack yarn opti-cms nextjs:create

      # -- Compile GraphQL ------------------------------------------------------
      - name: Compile GraphQL types
        run: |
          cd "${{ steps.config.outputs.folder }}"
          corepack yarn compile

      # -- Next.js build --------------------------------------------------------
      - name: Build
        run: |
          cd "${{ steps.config.outputs.folder }}"
          corepack yarn build

      # -- Commit generated files -> triggers Vercel auto-deploy ----------------
      - name: Commit and push
        run: |
          FOLDER="${{ steps.config.outputs.folder }}"
          SDK_LABEL="${{ inputs.sdk_branch != '' && inputs.sdk_branch || (inputs.sdk_version != '' && inputs.sdk_version || 'default') }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git ls-files --error-unmatch "$FOLDER/package.json" &>/dev/null 2>&1; then
            # First run -- stage entire bootstrapped project
            git add -A "$FOLDER/"
            COMMIT_MSG="bootstrap: initial $FOLDER [sdk=$SDK_LABEL] [run #${{ github.run_number }}]"
          else
            # Subsequent run -- only update generated dirs + manifest
            git rm -r --cached "$FOLDER/src/components/cms/" 2>/dev/null || true
            git rm -r --cached "$FOLDER/src/gql/"            2>/dev/null || true
            git add -A "$FOLDER/src/components/cms/"  2>/dev/null || true
            git add -A "$FOLDER/src/gql/"             2>/dev/null || true
            git add    "$FOLDER/package.json" "$FOLDER/yarn.lock" 2>/dev/null || true
            git add -A "$FOLDER/.packages/"            2>/dev/null || true
            COMMIT_MSG="chore: regenerate $FOLDER [sdk=$SDK_LABEL] [run #${{ github.run_number }}]"
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit -- skipping."
          else
            git commit -m "$COMMIT_MSG"
            git push origin main
          fi

      # -- Resolve Vercel project ID --------------------------------------------
      - name: Resolve Vercel project ID
        id: vercel_id
        run: |
          case "${{ inputs.case }}" in
            starter-prod)    echo "id=${{ secrets.VERCEL_PROJECT_ID_STARTER_PROD }}"     >> "$GITHUB_OUTPUT" ;;
            starter-testing) echo "id=${{ secrets.VERCEL_PROJECT_ID_STARTER_TESTING }}"  >> "$GITHUB_OUTPUT" ;;
            existing-prod)   echo "id=${{ secrets.VERCEL_PROJECT_ID_EXISTING_PROD }}"    >> "$GITHUB_OUTPUT" ;;
            *)               echo "id=${{ secrets.VERCEL_PROJECT_ID_EXISTING_TESTING }}"  >> "$GITHUB_OUTPUT" ;;
          esac

      # -- Wait for Vercel deployment -------------------------------------------
      - name: Wait for Vercel deployment
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.vercel_id.outputs.id }}
        run: |
          PUSH_TIME=$(date -u +%s)
          echo "Waiting for Vercel project $VERCEL_PROJECT_ID..."

          DEPLOY_URL=""
          for i in $(seq 1 36); do
            RESPONSE=$(curl -sf \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=1&target=production" \
              || echo '{}')

            STATE=$(echo "$RESPONSE" | python3 -c \
              "import sys,json; d=json.load(sys.stdin).get('deployments',[]); print(d[0]['state'] if d else 'NONE')" \
              2>/dev/null || echo "NONE")
            URL=$(echo "$RESPONSE" | python3 -c \
              "import sys,json; d=json.load(sys.stdin).get('deployments',[]); print(d[0].get('url','') if d else '')" \
              2>/dev/null || echo "")
            CREATED_MS=$(echo "$RESPONSE" | python3 -c \
              "import sys,json; d=json.load(sys.stdin).get('deployments',[]); print(d[0].get('createdAt',0) if d else 0)" \
              2>/dev/null || echo "0")
            CREATED_S=$(( CREATED_MS / 1000 ))

            echo "  attempt $i: state=$STATE created=$CREATED_S push=$PUSH_TIME url=$URL"

            if [ "$STATE" = "READY" ] && [ "$CREATED_S" -ge "$PUSH_TIME" ]; then
              DEPLOY_URL="https://$URL"
              echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
              echo "Deployment ready: $DEPLOY_URL"
              break
            elif [ "$STATE" = "ERROR" ] && [ "$CREATED_S" -ge "$PUSH_TIME" ]; then
              echo "Vercel deployment FAILED. Check the Vercel dashboard."
              exit 1
            fi

            sleep 10
          done

          if [ -z "$DEPLOY_URL" ]; then
            echo "Timed out waiting for Vercel."
            echo "deploy_url=(check Vercel dashboard)" >> "$GITHUB_OUTPUT"
          fi

      # -- Job summary ----------------------------------------------------------
      - name: Job summary
        if: always()
        run: |
          SITE="${{ steps.config.outputs.site }}"
          if [ "$SITE" = "prod" ]; then
            CMS_URL="${{ secrets.PROD_CMS_URL }}"
          else
            CMS_URL="${{ secrets.TEST_CMS_URL }}"
          fi
          DEPLOY_URL="${{ steps.vercel.outputs.deploy_url }}"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Remko SDK -- E2E Deploy

          | | |
          |---|---|
          | **Case** | ${{ inputs.case }} |
          | **SDK branch** | ${{ inputs.sdk_branch != '' && inputs.sdk_branch || '--' }} |
          | **SDK version** | ${{ inputs.sdk_version != '' && inputs.sdk_version || '--' }} |
          | **Vercel URL** | $DEPLOY_URL |
          | **CMS Edit Mode** | ${CMS_URL}ui/cms/ |

          ### Manual check steps
          1. Open **CMS Edit Mode**: \`${CMS_URL}ui/cms/\`
          2. Settings -> Applications -> verify frontend URL = \`$DEPLOY_URL\`
          3. Navigate to any content page -> confirm preview iframe loads
          4. Edit a text field -> confirm preview auto-updates
          EOF
